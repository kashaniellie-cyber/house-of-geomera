<title>House of GeoMera — Navigation Preview (not live)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@500;600&display=swap">
<style>
  :root {
    --linen: #f4efe6;
    --sand: #e2d6c1;
    --taupe: #9c8b70;
    --olive: #6b6f2a;
    --brown: #6e4a32;
    --brass: #b98f4e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ded4c2;
    font-family: 'Jost', sans-serif;
    padding: 60px 20px;
  }
  .note {
    max-width: 720px;
    margin: 0 auto 24px;
    font-size: 14px;
    color: var(--brown);
    background: var(--sand);
    border: 1px solid var(--taupe);
    padding: 14px 18px;
  }
  .site-header {
    max-width: 900px;
    margin: 0 auto;
    background: var(--linen);
    border-bottom: 1px solid var(--taupe);
    padding: 16px 26px;
  }
  .nav-grid {
    display: grid;
    grid-template-columns: 92px repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 7px;
    align-items: stretch;
  }
  .logo-cell {
    grid-row: 1 / 3;
    grid-column: 1;
    position: relative;
  }
  .logo-cell img, .logo-cell svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .lang-tag {
    position: absolute;
    bottom: 2px;
    right: 2px;
    font-size: 8px;
    color: var(--brass);
    border-bottom: 1px solid var(--brass);
    text-decoration: none;
  }
  .tab {
    border: 1px solid var(--taupe);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--brown);
    padding: 8px 6px;
    text-decoration: none;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .tab:hover, .tab.current {
    border-color: var(--olive);
    background: #ede3ce;
    color: var(--olive);
  }
  .r1c2 { grid-row: 1; grid-column: 2; }
  .r1c3 { grid-row: 1; grid-column: 3; }
  .r1c4 { grid-row: 1; grid-column: 4; }
  .r2c2 { grid-row: 2; grid-column: 2; }
  .r2c3 { grid-row: 2; grid-column: 3; }
  .r2c4 { grid-row: 2; grid-column: 4; }
</style>
</head>
